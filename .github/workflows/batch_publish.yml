name: 批量生成 SEO 靜態頁面

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "本次生成頁數（預設 50）"
        required: false
        default: "50"
      model_name:
        description: "使用的模型（預設 deepseek-chat）"
        required: false
        default: "deepseek-chat"
      site_domain:
        description: "站點域名（如已綁定自定義域名填這裡）"
        required: false
        default: ""

  schedule:
    # 每 3 小時跑一批，避免 API 超支
    - cron: "0 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout 倉庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 設置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 生成 SEO 靜態頁面
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.deepseek.com/v1' }}
          MODEL_NAME:      ${{ github.event.inputs.model_name || 'deepseek-chat' }}
          BATCH_SIZE:      ${{ github.event.inputs.batch_size || '50' }}
          # 優先用手動輸入的域名，其次用 Secret，再次用默認
          SITE_DOMAIN:     ${{ github.event.inputs.site_domain || secrets.SITE_DOMAIN || 'cqseo.github.io/heimaoseo' }}
        run: python main.py

      - name: 提交生成的文件到倉庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/ done_titles.txt published_urls.txt || true

          if git diff --cached --quiet; then
            echo "本次無新頁面生成"
          else
            NEW=$(git diff --cached --stat docs/p/ 2>/dev/null | grep -oP '\d+(?= insertion)' | head -1 || echo "0")
            TOTAL=$(find docs/p -name 'index.html' 2>/dev/null | wc -l)
            git commit -m "🤖 SEO 頁面：本批 +${NEW} 頁，累計 ${TOTAL} 頁 [skip ci]

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01LQg4o4cteWfN8Jbq7nAei6"
            git push
            echo "✅ 已推送 ${NEW} 頁新內容，站點累計 ${TOTAL} 頁"
          fi

      - name: 輸出進度摘要
        if: always()
        run: |
          echo "## 📊 生成摘要" >> $GITHUB_STEP_SUMMARY
          TOTAL_PAGES=$(find docs/p -name 'index.html' 2>/dev/null | wc -l)
          DONE_COUNT=$(wc -l < done_titles.txt 2>/dev/null || echo 0)
          REMAINING=$((1026 - DONE_COUNT))
          echo "- **已生成頁面**：${TOTAL_PAGES} 頁" >> $GITHUB_STEP_SUMMARY
          echo "- **剩餘待生成**：${REMAINING} 頁" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages**：https://cqseo.github.io/heimaoseo/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🗺️ Sitemap：https://cqseo.github.io/heimaoseo/sitemap.xml" >> $GITHUB_STEP_SUMMARY
